<text x="40.0" y="998.0" text-anchor="start" font-size="12" font-weight='bold' fill="#000">Проходи (виміряно за кресленням):</text>
<text x="40.0" y="1016.0" text-anchor="start" font-size="11"  fill="#000">Від ніжок ліжка до шафи/стіни: 75 см</text>
<text x="40.0" y="1034.0" text-anchor="start" font-size="11"  fill="#000">Прохід із півночі від ліжка: 155 см</text>
<text x="40.0" y="1052.0" text-anchor="start" font-size="11"  fill="#000">Прохід з півдня від ліжка: 65 см</text>
<text x="40.0" y="1084.0" text-anchor="start" font-size="10"  fill="#777">Розкладку знайдено автоматичним перебором: меблі біля стін, зони вільні, шлях від дверей до всіх зон шириною ≥ 0,6 м.</text>
<text x="40.0" y="1099.0" text-anchor="start" font-size="10"  fill="#777">Розміри меблів і відступи — типові припущення, не норми. Не враховано: розетки, батареї, відчинення вікон, штори, сторону світу.</text>
