<rect x="420" y="786.0" width="18" height="12" fill="#e9f5ea" stroke="#999" stroke-dasharray="3 2"/>
<text x="446" y="796.0" font-size="11">вхідна зона (0,6 × 0,9 м)</text>
<text x="40" y="828.0" font-size="12" font-weight="bold">Проходи (виміряно за креслеником):</text>
<text x="40" y="846.0" font-size="11">Шафа (фасад) — ніжки ліжка: 100 см</text>
<text x="40" y="864.0" font-size="11">Прохід із півночі від ліжка до стіни: 50 см</text>
<text x="40" y="882.0" font-size="11">Прохід з півдня від ліжка до стіни/столу: 70 см</text>
<text x="40" y="918.0" font-size="10" fill="#777">Розкладку знайдено автоматичним перебором: меблі біля стін, зони вільні, шлях від дверей до ліжка, столу і шафи шириною ≥ 0,6 м.</text>
<text x="40" y="934.0" font-size="10" fill="#777">Не враховано: розетки, вимикачі, батареї, фактичні розміри обраних меблів, відчинення вікна, сторону світу.</text>
