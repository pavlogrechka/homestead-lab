<text x="480.0" y="76" text-anchor="middle" font-size="11" fill="#777">Масштаб: 1 м = 160 px. Внутрішні розміри кімнати 3,6 × 2,8 м (10,1 м²). Схід — зовнішня стіна з вікном.</text>
