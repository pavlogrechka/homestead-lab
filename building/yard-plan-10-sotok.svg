<text x="70" y="735" font-size="13" font-weight="bold">Відстані (ДБН Б.2.2-12:2019, Зміна № 1)</text>
<text x="70" y="759" font-size="12">Будинок — гараж: <tspan font-weight="bold">10 м</tspan>  —  норма ≥ 10 м (табл. 10.6)</text>
<text x="70" y="779" font-size="12">Будинок — сарай: <tspan font-weight="bold">18 м</tspan>  —  норма ≥ 15 м (табл. 6.7)</text>
<text x="70" y="799" font-size="12">Будинок — вбиральня: <tspan font-weight="bold">26 м</tspan>  —  норма ≥ 20 м (табл. 6.7)</text>
<text x="70" y="819" font-size="12">Будинок — септик: <tspan font-weight="bold">6,1 м</tspan>  —  норма ≥ 5 м (табл. 6.7)</text>
<text x="70" y="839" font-size="12">Будівлі — межі ділянки: <tspan font-weight="bold">≥ 3 м</tspan>  —  норма ≥ 3 м (п. 6.1.41)</text>
<text x="70" y="925" font-size="11" fill="#777">Схема умовна: форма ділянки і сторони світу уточнюються.</text>
<text x="70" y="941" font-size="11" fill="#777">Не перевірено: протипожежні відстані (табл. 15.2) і відстані септика до межі.</text>
